name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify & Publish (@systemores/systemores-plugin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Ensure latest npm CLI (OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install dependencies (if lockfile present)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          fi

      - name: Run unit tests & manifest verification
        run: |
          npm test
          npm run verify

      - name: Publish to npm via OIDC with SLSA Provenance
        run: npm publish --provenance --access public
